<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabelas</title>
  </head>
  <body>
    <h1>tabelas em html5</h1>
    <p>
      as tabelas sao usadas para organizar dados<br />
      em linhas e colunas
    </p>
    <br />
    <hr />
    <br />

    <table border="2">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Cidade</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Bruno</td>
          <td>30</td>
          <td>Rio de janeiro</td>
        </tr>
        <tr>
          <td>Ana</td>
          <td>25</td>
          <td>Sao Paulo</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
