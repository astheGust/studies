<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AulaFrontEnd</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: content-box;
        }
        .title{
            font-size:18px;
            color:white;
        }
        .text{
            font-size:14px;
            color:#a1a1a1;
        }
        body{
            background-color:#1a1a1a;
        }
        div{
            border:1px outset purple;
            position:absolute;
            top:50%;
            left:50%;
            transform:translateX(-50%);
            display:flex;
            flex-direction:column;
            justify-content: center;
            align-items: center;
            gap:20px;
        }
    </style>
</head>
<body>
    <div>
        <h1 class="title">title1</h1>
        <p class="text">to no mei deles</p>
        <h2 class="title">title2</h2>
        <h3 class="title">title3</h3>
        <h4 class="title">title4</h4>
        <h5 class="title">title5</h5>
        <h6 class="title">title6</h6>
        
    </div>
</body>
</html>
